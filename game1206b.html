<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>NEON SURVIVOR</title><style>body{margin:0;background:#081222;color:#eff;text-align:center;font:16px Arial}h1{letter-spacing:5px}b{color:#6fd}canvas{width:min(94vw,900px);background:#112039;border:1px solid #456;border-radius:14px;touch-action:none}button{padding:13px 24px;margin:10px;background:#6fd;border:0;border-radius:8px;font-weight:bold}p{color:#abc}</style><h1>NEON <b>SURVIVOR</b></h1><div id="hud">출격 버튼을 눌러 시작</div><canvas id="c" width="900" height="550"></canvas><br><button onclick="start()">출격 / 다시 시작</button><button onclick="pause()">일시정지 / 계속</button><p>WASD·방향키 이동 · 자동 사격 · 적을 피해 최고 점수에 도전<br>모바일은 화면을 누르고 드래그해 이동</p><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),h=document.querySelector('#hud');let run=false,p,es=[],bs=[],ks={},t=0,sc=0,sp=0,fi=0,last=0;function start(){p={x:450,y:275,hp:5,inv:1,a:0};es=[];bs=[];t=sc=sp=fi=0;run=true}function pause(){run=!run}onkeydown=e=>{ks[e.code]=1;if(e.code.startsWith('Arrow'))e.preventDefault()};onkeyup=e=>ks[e.code]=0;function frame(now){let d=Math.min((now-last)/1000,.03);last=now;if(run){t+=d;p.inv-=d;let x=(ks.KeyD||ks.ArrowRight?1:0)-(ks.KeyA||ks.ArrowLeft?1:0),y=(ks.KeyS||ks.ArrowDown?1:0)-(ks.KeyW||ks.ArrowUp?1:0),n=Math.hypot(x,y)||1;p.x=Math.max(12,Math.min(888,p.x+x/n*250*d));p.y=Math.max(12,Math.min(538,p.y+y/n*250*d));sp-=d;if(sp<=0){let a=Math.random()*6.28;es.push({x:450+Math.cos(a)*500,y:275+Math.sin(a)*500});sp=Math.max(.18,.8-t*.007)}fi-=d;if(es.length&&fi<=0){let e=es.reduce((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)<Math.hypot(b.x-p.x,b.y-p.y)?a:b),a=Math.atan2(e.y-p.y,e.x-p.x);bs.push({x:p.x,y:p.y,vx:Math.cos(a)*600,vy:Math.sin(a)*600,l:2});fi=Math.max(.09,.3-Math.floor(sc/1000)*.025)}for(let b of bs){b.x+=b.vx*d;b.y+=b.vy*d;b.l-=d;for(let e of es)if(!e.dead&&b.l>0&&Math.hypot(e.x-b.x,e.y-b.y)<17){e.dead=1;b.l=0;sc+=100}}for(let e of es){if(e.dead)continue;let a=Math.atan2(p.y-e.y,p.x-e.x);e.x+=Math.cos(a)*(65+Math.min(t,100))*d;e.y+=Math.sin(a)*(65+Math.min(t,100))*d;if(p.inv<=0&&Math.hypot(p.x-e.x,p.y-e.y)<23){p.hp--;p.inv=1.3;if(p.hp<=0)run=false}}es=es.filter(e=>!e.dead);bs=bs.filter(b=>b.l>0);h.textContent=(run?'♥ '.repeat(p.hp):'GAME OVER · ')+'점수 '+sc+' · '+Math.floor(t)+'초'}g.fillStyle='#112039';g.fillRect(0,0,900,550);g.strokeStyle='#20334c';for(let x=0;x<900;x+=50){g.beginPath();g.moveTo(x,0);g.lineTo(x,550);g.stroke()}g.fillStyle='#fa638d';for(let e of es){g.save();g.translate(e.x,e.y);g.rotate(t);g.fillRect(-11,-11,22,22);g.restore()}g.fillStyle='#7fd';for(let b of bs){g.beginPath();g.arc(b.x,b.y,4,0,7);g.fill()}if(p){g.globalAlpha=p.inv>0?.5:1;g.beginPath();g.moveTo(p.x,p.y-16);g.lineTo(p.x+12,p.y+12);g.lineTo(p.x-12,p.y+12);g.fill();g.globalAlpha=1}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
